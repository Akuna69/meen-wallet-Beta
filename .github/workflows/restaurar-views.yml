name: Restaurar vistas faltantes

on:
  workflow_dispatch:

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de mi repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clonar carpeta view/ desde muun/apollo oficial
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/muun/apollo.git /tmp/muun-apollo
          cd /tmp/muun-apollo
          git sparse-checkout set android/apolloui/src/main/java/io/muun/apollo/presentation/ui/view
          cd -

          mkdir -p android/apolloui/src/main/java/io/muun/apollo/presentation/ui/view
          cp -rn /tmp/muun-apollo/android/apolloui/src/main/java/io/muun/apollo/presentation/ui/view/* \
                android/apolloui/src/main/java/io/muun/apo
