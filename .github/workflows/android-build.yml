name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Set up Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: r25c

      - name: Install gomobile & cargo-ndk
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cargo install cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew || true
          chmod +x android/gradlew || true
          chmod +x tools/*.sh || true

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew apolloui:assembleDebug --stacktrace -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meen-wallet-app-debug
          path: android/apolloui/build/outputs/apk/debug/*.apk
