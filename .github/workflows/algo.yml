name: Compilar APK Muun

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar NDK de Android
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21.x'
      env:
        GOTOOLCHAIN: local

    - name: Limpiar cache e instalar gomobile
      run: |
        go clean -cache -testcache -modcache
        go install golang.org/x/tools/cmd/goimports@latest
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Crear dummy libs y directorios de stubs Kotlin
      run: |
        mkdir -p libwallet/librs/libs
        touch libwallet/librs/libs/x86_64-linux-android-librs.a
        touch libwallet/librs/libs/aarch64-linux-android-librs.a
        touch libwallet/librs/libs/armv7-linux-androideabi-librs.a
        touch libwallet/librs/libs/i686-linux-android-librs.a

        mkdir -p android/apolloui/src/main/java/io/muun/apollo/presentation/app/di/modules/
        mkdir -p android/apolloui/src/main/java/io/muun/apollo/presentation/ui/home/
        mkdir -p android/apolloui/src/main/java/io/muun/muun/

    - name: Generar stubs Kotlin necesarios para Apollo
      run: |
        printf 'package io.muun.apollo.presentation.ui.home\n\nimport android.content.Context\n\nopen class InAppUpdateManager(context: Context? = null) {\n    interface Factory {\n        fun create(context: Context): InAppUpdateManager\n    }\n    open fun checkForUpdate() {}\n}\n' > android/apolloui/src/main/java/io/muun/apollo/presentation/ui/home/InAppUpdateManager.kt

        printf 'package io.muun.apollo.presentation.ui.home\n\nimport android.content.Context\n\nopen class PlayInAppUpdateManager(context: Context? = null) : InAppUpdateManager(context)\n' > android/apolloui/src/main/java/io/muun/apollo/presentation/ui/home/PlayInAppUpdateManager.kt

        printf 'package io.muun.muun\n\nobject Cause {\n    val logging: Any = Any()\n    val TraceSection: Any = Any()\n    fun cause(block: () -> Unit) {}\n    fun cause(param: Any, block: () -> Unit) {}\n    fun tostacktracelement(): StackTraceElement {\n        return StackTraceElement("", "", "", 0)\n    }\n}\n' > android/apolloui/src/main/java/io/muun/muun/Cause.kt

    - name: Dar permisos y compilar APK sin tests
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
      run: |
        chmod +x gradlew
        chmod +x tools/libwallet-android.sh
        ./gradlew :android:apolloui:assembleDogfoodDebug -x test -x lint --warning-mode all

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: app-dogfood-debug
        path: android/apolloui/build/outputs/apk/dogfood/debug/*.apk
