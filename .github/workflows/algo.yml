name: Compilar APK Meen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'
      env:
        GOTOOLCHAIN: local

    - name: Instalar gomobile
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Crear dummy libs y directorios
      run: |
        mkdir -p libwallet/librs/libs
        touch libwallet/librs/libs/x86_64-linux-android-librs.a
        touch libwallet/librs/libs/aarch64-linux-android-librs.a
        touch libwallet/librs/libs/armv7-linux-androideabi-librs.a
        touch libwallet/librs/libs/i686-linux-android-librs.a
        mkdir -p android/apollo/src/main/java/libwallet/

    - name: Generar Libwallet stub
      run: |
        printf 'package libwallet\n\nobject Libwallet {\n    fun initialize() {}\n}\n\nopen class Wallet {\n    open fun balance(): Long = 0L\n}\n\nopen class BitcoinAmount {\n    open fun inSatoshis(): Long = 0L\n}\n' > android/apollo/src/main/java/libwallet/Libwallet.kt

    - name: Dar permisos y compilar con Gradle (Dogfood Debug)
      run: |
        chmod +x gradlew
        ./gradlew :android:apolloui:assembleDogfoodDebug --warning-mode all

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: app-dogfood-debug
        path: android/apolloui/build/outputs/apk/dogfood/debug/*.apk
