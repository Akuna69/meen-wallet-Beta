name: Compilar APK Meen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'
      env:
        GOTOOLCHAIN: local

    - name: Instalar e inicializar gomobile
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Crear librerias .a dummy de Rust
      run: |
        mkdir -p libwallet/librs/libs
        touch libwallet/librs/libs/x86_64-linux-android-librs.a
        touch libwallet/librs/libs/aarch64-linux-android-librs.a
        touch libwallet/librs/libs/armv7-linux-androideabi-librs.a
        touch libwallet/librs/libs/i686-linux-android-librs.a

    - name: Dar permisos a gradlew
      run: chmod +x gradlew

    - name: Crear google-services.json multicliend para prod y debug
      run: |
        mkdir -p android/apolloui
        cat > android/apolloui/google-services.json << 'EOF_JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "dummy-project"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "io.meen.apollo" }
              },
              "api_key": [{ "current_key": "dummy" }]
            },
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                "android_client_info": { "package_name": "io.meen.apollo.debug" }
              },
              "api_key": [{ "current_key": "dummy" }]
            }
          ],
          "configuration_version": "1"
        }
        EOF_JSON

    - name: Inyectar todos los Stubs unificados (Libwallet, Estados y newop)
      run: |
        # Directorios necesarios
        mkdir -p android/apollo/src/main/java/libwallet/
        mkdir -p android/apollo/src/main/java/io/muun/apollo/domain/model/
        mkdir -p android/apolloui/src/main/java/io/muun/apollo/presentation/ui/new_operation/
        
        # 1. Libwallet
        cat << 'EOF_LIBWALLET' > android/apollo/src/main/java/libwallet/Libwallet.kt
        package libwallet

        object Libwallet {
            fun initialize() {}
        }

        open class Wallet {
            open fun balance(): Long = 0L
        }
        EOF_LIBWALLET

        # 2. UserActivatedFeature
        cat << 'EOF_FEATURE' > android/apollo/src/main/java/io/muun/apollo/domain/model/UserActivatedFeature.kt
        package io.muun.apollo.domain.model

        enum class UserActivatedFeature {
            LIGHTNING_NODE_MANAGEMENT,
            SWAP_FEATURE,
            FEE_BUMPING;

            companion object {
                val values = entries.toTypedArray()
            }
        }
        EOF_FEATURE

        # 3. Estados de New Operation y NewOp
        cat << 'EOF_STUBS' > android/apolloui/src/main/java/io/muun/apollo/presentation/ui/new_operation/MissingStubs.kt
        package io.muun.apollo.presentation.ui.new_operation

        object NewOp {
            val enterAmount: Any = Any()
            val enterDescription: Any = Any()
            val totalbalance: Any = Any()
            val validated: Any = Any()
            val EnterAmount = EnterAmountState()
            val EnterDescription = EnterDescriptionState()
            val Start = StartState()
            val Validate = ValidateState()
            val BalanceError = BalanceErrorState()
            val Abort = AbortState()
            val Confirm = ConfirmState()
            val ConfirmLightning = ConfirmLightningState()
            val ValidateLightning = ValidateLightningState()
        }
        
        open class EnterAmountState
        open class EnterDescriptionState
        open class StartState
        open class ValidateState
        open class BalanceErrorState
        open class AbortState
        open class ConfirmState
        open class ConfirmLightningState
        open class ValidateLightningState {
            open fun onValidateLightning() {}
        }
        EOF_STUBS

        # 4. Objeto newop en minúsculas
        cat << 'EOF_NEWOP' > android/apolloui/src/main/java/io/muun/apollo/presentation/ui/new_operation/newop.kt
        package io.muun.apollo.presentation.ui.new_operation

        object newop {
            val enterAmount: Any = Any()
            val enterDescription: Any = Any()
            val totalbalance: Any = Any()
            val validated: Any = Any()
            val EnterAmount = EnterAmountState()
            val EnterDescription = EnterDescriptionState()
            val Start = StartState()
            val Validate = ValidateState()
            val BalanceError = BalanceErrorState()
            val Abort = AbortState()
            val Confirm = ConfirmState()
            val ConfirmLightning = ConfirmLightningState()
            val ValidateLightning = ValidateLightningState()
        }
        EOF_NEWOP

    - name: Compilar APK con Gradle
      run: ./gradlew :android:apolloui:assembleDebug --warning-mode all

    - name: Subir archivo APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          android/apolloui/build/outputs/apk/debug/*.apk
