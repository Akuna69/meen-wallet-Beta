name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Limpiar cache e instalar gomobile
        run: |
          go clean -testcache -modcache
          go install golang.org/x/tools/cmd/goimports@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Crear dummy libs de Rust
        run: |
          mkdir -p libwallet/libs/libs
          touch libwallet/libs/libs/x86_64-linux-android-libs.a
          touch libwallet/libs/libs/aarch64-linux-android-libs.a
          touch libwallet/libs/libs/armv7-linux-android-libs.a
          touch libwallet/libs/libs/i686-linux-android-libs.a

      - name: Dar permisos y compilar APK sin tests
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          chmod +x gradlew
          chmod +x tools/libwallet-android.sh
          ./gradlew :android:apolloui:assembleDogfoodDebug -x test -x lint --warning-mode all --stacktrace

      - name: Subir artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dogfood-debug
          path: android/apolloui/build/outputs/apk/dogfood/debug/*.apk

