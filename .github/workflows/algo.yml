name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Limpiar cache e instalar gomobile
        run: |
          go clean -testcache -modcache
          go install golang.org/x/tools/cmd/goimports@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Crear dummy libs de Rust
        run: |
          mkdir -p libwallet/libs/libs
          touch libwallet/libs/libs/x86_64-linux-android-libs.a
          touch libwallet/libs/libs/aarch64-linux-android-libs.a
          touch libwallet/libs/libs/armv7-linux-android-libs.a
          touch libwallet/libs/libs/i686-linux-android-libs.a

      - name: Dar permisos y compilar APK sin tests
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
          JAVA_TOOL_OPTIONS: >-
            --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
            --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.util=ALL-UNNAMED
        run: |
          chmod +x gradlew
          chmod +x tools/libwallet-android.sh
          ./gradlew :android:apolloui:assembleDogfoodDebug -x test -x lint -Pkapt.use.worker.api=false --warning-mode all --stacktrace

      - name: Subir artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dogfood-debug
          path: android/apolloui/build/outputs/apk/dogfood/debug/*.apk

