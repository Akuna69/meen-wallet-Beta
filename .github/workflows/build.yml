name: Compilar APK Muun

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar Java (necesario para compilar Android)
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Configurar Go actualizado (versión 1.26 o superior requerida)
    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    # 4. Instalar e inicializar gomobile correctamente
    - name: Instalar e inicializar gomobile
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    # 5. Dar permisos de ejecución a Gradle Wrapper
    - name: Dar permisos a gradlew
      run: chmod +x gradlew

    # 6. Compilar la aplicación apuntando al módulo correcto
    - name: Compilar APK con Gradle
      run: ./gradlew :android:apolloui:assembleDebug --warning-mode all

    # 7. Subir la APK generada para que puedas descargarla
    - name: Subir archivo APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          android/apolloui/build/outputs/apk/debug/*.apk
