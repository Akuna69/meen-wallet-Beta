name: Build Debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/go/bin"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          gomobile init

      - name: Crear google-services.json de prueba
        run: |
          cat > android/apolloui/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "meen-wallet-test",
              "storage_bucket": "meen-wallet-test.appspot.com"
            },
            "client": [
              {"client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcd00", "android_client_info": {"package_name": "io.muun.apollo"}}, "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly000000000000"}]},
              {"client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcd01", "android_client_info": {"package_name": "io.muun.apollo.debug"}}, "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly000000000000"}]}
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Poner nombre Meen Wallet
        run: |
          sed -i 's|resValue "string", "app_name", "[^"]*"|resValue "string", "app_name", "Meen Wallet"|' android/apolloui/build.gradle

      - name: Build Debug APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          chmod +x gradlew tools/*.sh
          ./gradlew :android:apolloui:assembleProdDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/apolloui/build/outputs/apk/prod/debug/*.apk
