name: Compilar APK Muun

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Usar Go 1.22 para evitar el fallo de gomobile en libwallet
    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'
      env:
        GOTOOLCHAIN: local

    - name: Instalar e inicializar gomobile
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Dar permisos a gradlew
      run: chmod +x gradlew

    - name: Compilar APK con Gradle
      run: ./gradlew :android:apolloui:assembleDebug --warning-mode all

    - name: Subir archivo APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          android/apolloui/build/outputs/apk/debug/*.apk
