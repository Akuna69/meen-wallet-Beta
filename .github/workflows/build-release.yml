name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: actions/setup-android@v3
        with:
          # Acepta todas las licencias automáticamente
          accept-licenses: true

      - name: Configurar Go (opcional)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew
        working-directory: android   # Ajusta si tu gradlew está en android/

      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: android   # Ejecuta dentro de la carpeta android

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/apolloui/build/outputs/apk/debug/*.apk
